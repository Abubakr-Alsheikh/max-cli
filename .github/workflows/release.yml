name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install build

    - name: Test before publishing
      run: |
        pytest -q

    - name: Build package
      run: |
        python -m build

    # The notes are the version's section of CHANGELOG.md. A changelog action
    # used a personal token here; when it expired, v0.4.0 never published.
    - name: Release notes
      run: |
        python - <<'EOF'
        import os
        import re
        from pathlib import Path

        version = os.environ["GITHUB_REF_NAME"].lstrip("v")
        changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
        section = re.search(
            rf"^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)",
            changelog,
            re.MULTILINE | re.DOTALL,
        )
        notes = section.group(1).strip() if section else f"Max {version}"
        Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
        EOF

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        body_path: release-notes.md
        draft: false
        prerelease: false
        files: dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1.13
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
