[mypy]
# 3.10, not 3.9: dependencies such as click 8.5 use 3.10+ syntax, which aborts
# a 3.9-targeted run. The CI test matrix and the rule hook guard 3.9 support.
python_version = 3.10
# Pin the platform so local (Windows/macOS) runs report the same errors as CI.
platform = linux
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False
no_implicit_optional = False
warn_redundant_casts = False
warn_unused_ignores = True
warn_no_return = False
warn_unreachable = False
strict_equality = False

[mypy-tests.*]
ignore_errors = True


# Third-party packages that ship neither type stubs nor a py.typed marker.
[mypy-fitz.*]
ignore_missing_imports = True

[mypy-pytesseract.*]
ignore_missing_imports = True
