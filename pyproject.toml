[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "max-cli"
version = "0.3.0"
description = "The Local, Fast, & Lazy Terminal Assistant for high-performance tasks."
authors = [{name = "Abubakr Alsheikh", email = "abubakralsheikh@outlook.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",       # Remove the [all] extra
    "rich>=13.0.0",
    "shellingham>=1.5.0", # Add this for better shell completion detection
    "pillow>=10.0.0",
    "pymupdf>=1.22.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "yt-dlp>=2023.0.0",
    "segno>=1.5.0",
    "pyperclip>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
ocr = [
    "pytesseract>=0.3.10",
]

[project.scripts]
max = "max_cli.main:main"

[tool.ruff]
line-length = 88
